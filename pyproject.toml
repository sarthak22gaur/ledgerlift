[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerlift"
version = "0.1.0"
description = "Local-first ETL pipeline for parsing personal financial statements into a canonical transaction ledger"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11,<1",
    "click>=8.1,<9",
    "pydantic>=2.5,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "rapidfuzz>=3,<4",
]

[project.scripts]
ledgerlift = "ledgerlift.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]
